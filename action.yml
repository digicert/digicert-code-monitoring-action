name: "DigiCert Code Monitoring Action"
description: "Runs CodeQL multi-language scan (languages auto from backend) and generates SBOM. Uploads artifacts for backend ingestion."
author: "DigiCert"

inputs:
  env:
    description: "Backend environment to use (prod|stage)"
    required: false
    default: "prod"

  region:
    description: "DC One region for authentication/routing (required)"
    required: true

  api-key:
    description: "API key for DigiCert backend (pass via secrets)"
    required: true
  name:
    description: "Repo-scoped scan name used to create/find a DC One external release and dedupe scans by (name + branch + commitSha). If with-release is true, this must be provided."
    required: false

  with-release:
    description: "When true, require name and tag and build the scan name as '<name>-<tag>' so runs align with a specific release tag."
    required: false
    default: "false"

  tag:
    description: "Release tag used only when with-release is true (required when with-release is true)."
    required: false

runs:
  using: "composite"
  steps:
    - name: Block unsafe pull_request_target trigger
      shell: bash
      run: |
        set -euo pipefail

        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          echo "This action must not run on pull_request_target due to secret exposure risk." >&2
          echo "Use pull_request (or push/workflow_dispatch) instead." >&2
          exit 1
        fi

    - name: Sanitize and normalize action inputs
      shell: bash
      env:
        RAW_ENV: ${{ inputs.env }}
        RAW_REGION: ${{ inputs.region }}
        RAW_API_KEY: ${{ inputs.api-key }}
        RAW_NAME: ${{ inputs.name }}
        RAW_WITH_RELEASE: ${{ inputs.with-release }}
        RAW_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        # Reject control characters (including CR/LF) to prevent shell/header injection.
        reject_control_chars() {
          local value="$1"
          if printf '%s' "$value" | LC_ALL=C grep -q '[[:cntrl:]]'; then
            return 1
          fi
          return 0
        }

        INPUT_ENV="$(printf '%s' "${RAW_ENV:-prod}" | tr '[:upper:]' '[:lower:]' | xargs)"
        if [ -z "$INPUT_ENV" ]; then
          INPUT_ENV="prod"
        fi
        case "$INPUT_ENV" in
          prod|stage)
            ;;
          *)
            echo "Unsupported env: '$INPUT_ENV' (use prod|stage)" >&2
            exit 1
            ;;
        esac

        INPUT_WITH_RELEASE="$(printf '%s' "${RAW_WITH_RELEASE:-false}" | tr '[:upper:]' '[:lower:]' | xargs)"
        if [ -z "$INPUT_WITH_RELEASE" ]; then
          INPUT_WITH_RELEASE="false"
        fi
        case "$INPUT_WITH_RELEASE" in
          true|false)
            ;;
          *)
            echo "Invalid with-release input: '$INPUT_WITH_RELEASE' (use true|false)" >&2
            exit 1
            ;;
        esac

        INPUT_REGION="$(printf '%s' "${RAW_REGION:-}" | xargs)"
        if [ -z "$INPUT_REGION" ]; then
          echo "Input 'region' is required." >&2
          exit 1
        fi
        if ! reject_control_chars "$INPUT_REGION"; then
          echo "Invalid region: contains control characters." >&2
          exit 1
        fi
        if ! printf '%s' "$INPUT_REGION" | LC_ALL=C grep -Eq '^[A-Za-z0-9._-]{1,32}$'; then
          echo "Invalid region format: use 1-32 chars [A-Za-z0-9._-]." >&2
          exit 1
        fi

        INPUT_API_KEY="${RAW_API_KEY:-}"
        if [ -z "$INPUT_API_KEY" ]; then
          echo "Input 'api-key' is required." >&2
          exit 1
        fi
        if ! reject_control_chars "$INPUT_API_KEY"; then
          echo "Invalid api-key: contains control characters." >&2
          exit 1
        fi

        INPUT_NAME="${RAW_NAME:-}"
        INPUT_TAG="${RAW_TAG:-}"
        if ! reject_control_chars "$INPUT_NAME"; then
          echo "Invalid name: contains control characters." >&2
          exit 1
        fi
        if ! reject_control_chars "$INPUT_TAG"; then
          echo "Invalid tag: contains control characters." >&2
          exit 1
        fi

        {
          echo "DC_INPUT_ENV=$INPUT_ENV"
          echo "DC_INPUT_REGION=$INPUT_REGION"
          echo "DC_INPUT_WITH_RELEASE=$INPUT_WITH_RELEASE"
          echo "DC_INPUT_NAME<<__DC_EOF__"
          echo "$INPUT_NAME"
          echo "__DC_EOF__"
          echo "DC_INPUT_TAG<<__DC_EOF__"
          echo "$INPUT_TAG"
          echo "__DC_EOF__"
        } >> "$GITHUB_ENV"

    - name: Resolve backend base URL
      shell: bash
      run: |
        set -euo pipefail

        case "${DC_INPUT_ENV}" in
          prod)
            echo "BACKEND_BASE_URL=https://releasemonitor.digicert.com" >> "$GITHUB_ENV"
            ;;
          stage)
            echo "BACKEND_BASE_URL=https://releasemonitor.stage.az.digicert.net" >> "$GITHUB_ENV"
            ;;
          *)
            echo "Unsupported env: '${DC_INPUT_ENV}' (use prod|stage)" >&2
            exit 1
            ;;
        esac

    - name: Checkout repository
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        persist-credentials: false

    - name: Resolve repo context (owner/repo/ref)
      shell: bash
      run: |
        set -euo pipefail

        if [ -z "${GITHUB_REPOSITORY_OWNER:-}" ] || [ -z "${GITHUB_REPOSITORY:-}" ]; then
          echo "Missing GitHub repository context (GITHUB_REPOSITORY_OWNER/GITHUB_REPOSITORY)." >&2
          exit 1
        fi

        # GITHUB_REPOSITORY = owner/repo
        DC_OWNER="${GITHUB_REPOSITORY_OWNER}"
        DC_REPO="${GITHUB_REPOSITORY#*/}"
        DC_REF="${GITHUB_REF:-}"

        if [ -z "$DC_REPO" ] || [ "$DC_REPO" = "$GITHUB_REPOSITORY" ]; then
          echo "Could not parse repo name from GITHUB_REPOSITORY=$GITHUB_REPOSITORY" >&2
          exit 1
        fi

        echo "DC_OWNER=$DC_OWNER" >> "$GITHUB_ENV"
        echo "DC_REPO=$DC_REPO" >> "$GITHUB_ENV"
        {
          echo "DC_REF<<__DC_EOF__"
          echo "$DC_REF"
          echo "__DC_EOF__"
        } >> "$GITHUB_ENV"

        # Action constants (avoid additional inputs).
        echo "DC_CODEQL_BUILD_MODE=none" >> "$GITHUB_ENV"
        echo "DC_SARIF_OUTPUT=codeql.sarif" >> "$GITHUB_ENV"
        echo "DC_SARIF_ARTIFACT_NAME=digicert_scan_results" >> "$GITHUB_ENV"
        echo "DC_SBOM_OUTPUT=sbom.cyclonedx.json" >> "$GITHUB_ENV"
        echo "DC_SBOM_ARTIFACT_NAME=sbom-cyclonedx" >> "$GITHUB_ENV"
        echo "DC_CURL_CONNECT_TIMEOUT=10" >> "$GITHUB_ENV"
        echo "DC_CURL_MAX_TIME=60" >> "$GITHUB_ENV"
        echo "DC_CURL_RETRY_COUNT=3" >> "$GITHUB_ENV"
        echo "DC_CURL_RETRY_DELAY=2" >> "$GITHUB_ENV"

        # Default: run the scan unless backend prepare says otherwise.
        echo "DC_SHOULD_RUN=true" >> "$GITHUB_ENV"

    - name: Prepare Code Analysis Scan (name)
      id: cas_prepare
      shell: bash
      env:
        DC_INPUT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail

        WITH_RELEASE_RAW="${DC_INPUT_WITH_RELEASE}"
        WITH_RELEASE="$(echo "${WITH_RELEASE_RAW:-false}" | tr '[:upper:]' '[:lower:]' | xargs)"
        if [ -z "$WITH_RELEASE" ]; then
          WITH_RELEASE="false"
        fi

        case "$WITH_RELEASE" in
          true|false)
            ;;
          *)
            echo "Invalid with-release input: '$WITH_RELEASE_RAW' (use true|false)" >&2
            exit 1
            ;;
        esac

        if [ "$WITH_RELEASE" = "true" ]; then
          WITH_RELEASE_JSON=true
        else
          WITH_RELEASE_JSON=false
        fi

        NAME_RAW="${DC_INPUT_NAME}"
        TAG_RAW="${DC_INPUT_TAG}"
        TAG="$(echo "${TAG_RAW:-}" | xargs || true)"

        if [ "$WITH_RELEASE" = "true" ]; then
          if [ -z "$NAME_RAW" ] || [ "$NAME_RAW" = "null" ]; then
            echo "Input 'name' is required when with-release is true." >&2
            exit 1
          fi
          if [ -z "$TAG_RAW" ] || [ "$TAG_RAW" = "null" ]; then
            echo "Input 'tag' is required when with-release is true." >&2
            exit 1
          fi
          SCAN_NAME_RAW="${NAME_RAW}-${TAG_RAW}"
        else
          SCAN_NAME_RAW="$NAME_RAW"
          if [ -z "$SCAN_NAME_RAW" ] || [ "$SCAN_NAME_RAW" = "null" ]; then
            WF="${GITHUB_WORKFLOW:-code-analysis-scan}"
            EVT="${GITHUB_EVENT_NAME:-manual}"
            SCAN_NAME_RAW="${WF}-${EVT}"
          fi
        fi

        SCAN_NAME="$SCAN_NAME_RAW"

        SCAN_NAME="$(echo "$SCAN_NAME" | \
          sed -E 's/[[:space:]]+/-/g; s#[/\\\\]+#-#g; s/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//' | \
          cut -c1-100)"

        if [ -z "$SCAN_NAME" ]; then
          SCAN_NAME="code-analysis-${GITHUB_EVENT_NAME:-manual}"
        fi

        echo "DC_SCAN_NAME=$SCAN_NAME" >> "$GITHUB_ENV"

        URL="${BACKEND_BASE_URL}/releasemonitor/api/v1/gha/code-analysis/scans/prepare"
        echo "Preparing CAS at: $URL"

        REPO_FULL_NAME="${GITHUB_REPOSITORY:-${DC_OWNER}/${DC_REPO}}"
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          REF_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        else
          REF_NAME="${GITHUB_REF_NAME:-}"
        fi
        TRIGGERED_BY="${GITHUB_TRIGGERING_ACTOR:-${GITHUB_ACTOR:-}}"

        payload="$(jq -cn \
          --arg scanName "$SCAN_NAME" \
          --argjson withRelease "$WITH_RELEASE_JSON" \
          --arg tag "$TAG" \
          --arg repository "$REPO_FULL_NAME" \
          --arg owner "${DC_OWNER}" \
          --arg repo "${DC_REPO}" \
          --arg ref "${GITHUB_REF:-${DC_REF}}" \
          --arg refName "$REF_NAME" \
          --arg sha "${GITHUB_SHA:-}" \
          --arg actor "${GITHUB_ACTOR:-}" \
          --arg triggeringActor "${GITHUB_TRIGGERING_ACTOR:-}" \
          --arg triggeredBy "$TRIGGERED_BY" \
          --arg runId "${GITHUB_RUN_ID:-}" \
          --arg runAttempt "${GITHUB_RUN_ATTEMPT:-}" \
          --arg workflow "${GITHUB_WORKFLOW:-}" \
          --arg workflowRef "${GITHUB_WORKFLOW_REF:-}" \
          --arg job "${GITHUB_JOB:-}" \
          --arg eventName "${GITHUB_EVENT_NAME:-}" \
          '{
            scanName: $scanName,
            withRelease: $withRelease,
            tag: $tag,
            github: {
              repository: $repository,
              owner: $owner,
              repo: $repo,
              ref: $ref,
              refName: $refName,
              sha: $sha,
              actor: $actor,
              triggeringActor: $triggeringActor,
              triggeredBy: $triggeredBy,
              eventName: $eventName,
              workflow: $workflow,
              workflowRef: $workflowRef,
              job: $job,
              runId: $runId,
              runAttempt: $runAttempt
            }
          }')"

        HEADER_FILE="$(mktemp)"
        trap 'rm -f "$HEADER_FILE"' EXIT
        printf 'X-API-KEY: %s\nX-DCONE-REGION: %s\n' "${DC_INPUT_API_KEY}" "${DC_INPUT_REGION}" > "$HEADER_FILE"

        raw="$(curl -sS -X POST "$URL" \
          --connect-timeout "${DC_CURL_CONNECT_TIMEOUT}" \
          --max-time "${DC_CURL_MAX_TIME}" \
          --retry "${DC_CURL_RETRY_COUNT}" \
          --retry-delay "${DC_CURL_RETRY_DELAY}" \
          --retry-all-errors \
          -H "Content-Type: application/json" \
          -H @"$HEADER_FILE" \
          --data-raw "$payload" \
          -w $'\n%{http_code}')"

        body="${raw%$'\n'*}"
        status="${raw##*$'\n'}"

        if [ -z "$status" ] || ! [[ "$status" =~ ^[0-9][0-9][0-9]$ ]]; then
          echo "Failed to prepare CAS (no valid HTTP status from backend)." >&2
          exit 1
        fi

        if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
          ERR_MSG="$(echo "$body" | jq -r '.error.message? // .error? // .message? // empty' 2>/dev/null || true)"
          if [ -z "$ERR_MSG" ]; then
            ERR_MSG="Backend returned HTTP $status"
          fi
          echo "Failed to prepare CAS (HTTP $status). Error: $ERR_MSG" >&2
          exit 1
        fi

        CAS_ID="$(echo "$body" | jq -r '.id // empty')"
        SHOULD_RUN="$(echo "$body" | jq -r 'if has("shouldRun") then (.shouldRun | tostring) else empty end')"

        if [ -z "$CAS_ID" ]; then
          echo "Backend did not return CAS id." >&2
          exit 1
        fi

        if [ -z "$SHOULD_RUN" ]; then
          echo "Backend did not return shouldRun." >&2
          exit 1
        fi

        if ! printf '%s' "$CAS_ID" | LC_ALL=C grep -Eq '^[A-Za-z0-9._-]{1,128}$'; then
          echo "Invalid CAS_ID format from backend." >&2
          exit 1
        fi

        case "$SHOULD_RUN" in
          true|false) ;;
          *) echo "Unexpected shouldRun value from backend: '$SHOULD_RUN'" >&2; exit 1 ;;
        esac

        _DELIM="$(openssl rand -hex 16)"
        {
          printf 'DC_CAS_ID<<%s\n' "$_DELIM"
          printf '%s\n' "$CAS_ID"
          printf '%s\n' "$_DELIM"
          printf 'DC_SHOULD_RUN<<%s\n' "$_DELIM"
          printf '%s\n' "$SHOULD_RUN"
          printf '%s\n' "$_DELIM"
        } >> "$GITHUB_ENV"

        {
          printf 'id<<%s\n' "$_DELIM"
          printf '%s\n' "$CAS_ID"
          printf '%s\n' "$_DELIM"
          printf 'shouldRun<<%s\n' "$_DELIM"
          printf '%s\n' "$SHOULD_RUN"
          printf '%s\n' "$_DELIM"
        } >> "$GITHUB_OUTPUT"

        if [ "$SHOULD_RUN" != "true" ]; then
          echo "Scan already completed or in progress; skipping (shouldRun=$SHOULD_RUN)."
        fi

    - name: Resolve CodeQL languages
      id: langs
      shell: bash
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      env:
        DC_INPUT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail

        URL="${BACKEND_BASE_URL}/releasemonitor/api/v1/gha/code-analysis/languages"
        echo "Fetching languages from: $URL"

        HEADER_FILE="$(mktemp)"
        trap 'rm -f "$HEADER_FILE"' EXIT
        printf 'X-API-KEY: %s\nX-DCONE-REGION: %s\n' "${DC_INPUT_API_KEY}" "${DC_INPUT_REGION}" > "$HEADER_FILE"

        # Requires jq on runner (ubuntu has it)
        # Capture body + status code to handle API errors gracefully.
        if [ -n "${DC_REF}" ]; then
          RAW="$(curl -sS -G "$URL" \
              --connect-timeout "${DC_CURL_CONNECT_TIMEOUT}" \
              --max-time "${DC_CURL_MAX_TIME}" \
              --retry "${DC_CURL_RETRY_COUNT}" \
              --retry-delay "${DC_CURL_RETRY_DELAY}" \
              --retry-all-errors \
            -H @"$HEADER_FILE" \
            --data-urlencode "repo=${DC_REPO}" \
            --data-urlencode "ref=${DC_REF}" \
            -w $'\n%{http_code}')"
        else
          RAW="$(curl -sS -G "$URL" \
              --connect-timeout "${DC_CURL_CONNECT_TIMEOUT}" \
              --max-time "${DC_CURL_MAX_TIME}" \
              --retry "${DC_CURL_RETRY_COUNT}" \
              --retry-delay "${DC_CURL_RETRY_DELAY}" \
              --retry-all-errors \
            -H @"$HEADER_FILE" \
            --data-urlencode "repo=${DC_REPO}" \
            -w $'\n%{http_code}')"
        fi

        BODY="${RAW%$'\n'*}"
        STATUS="${RAW##*$'\n'}"

        if [ -z "$STATUS" ] || ! [[ "$STATUS" =~ ^[0-9][0-9][0-9]$ ]]; then
          echo "Failed to call backend (no valid HTTP status)." >&2
          exit 1
        fi

        if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
          ERR_MSG="$(echo "$BODY" | jq -r '.error.message? // .error? // .message? // empty' 2>/dev/null || true)"
          if [ -z "$ERR_MSG" ]; then
            ERR_MSG="Backend returned HTTP $STATUS"
          fi
          echo "Failed to fetch languages: $ERR_MSG" >&2
          exit 1
        fi

        echo "Backend response: $BODY"

        LANGS="$(echo "$BODY" | jq -e -r '.languages | select(type=="array") | join(",")' 2>/dev/null || true)"

        if [ -z "$LANGS" ] || [ "$LANGS" = "null" ]; then
          echo "No languages returned by backend." >&2
          exit 1
        fi

        IFS=',' read -ra _LANG_ARR <<< "$LANGS"
        for _lang in "${_LANG_ARR[@]}"; do
          if ! printf '%s' "$_lang" | LC_ALL=C grep -Eq '^[a-z-]{1,32}$'; then
            echo "Invalid language identifier from backend: '$_lang'" >&2
            exit 1
          fi
        done
        unset _LANG_ARR _lang

        _DELIM="$(openssl rand -hex 16)"
        {
          printf 'LANGS<<%s\n' "$_DELIM"
          printf '%s\n' "$LANGS"
          printf '%s\n' "$_DELIM"
        } >> "$GITHUB_ENV"
        {
          printf 'languages<<%s\n' "$_DELIM"
          printf '%s\n' "$LANGS"
          printf '%s\n' "$_DELIM"
        } >> "$GITHUB_OUTPUT"

    - name: Initialize CodeQL
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
      with:
        languages: ${{ steps.langs.outputs.languages }}
        build-mode: ${{ env.DC_CODEQL_BUILD_MODE }}

    - name: Perform CodeQL Analysis
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      uses: github/codeql-action/analyze@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
      with:
        upload: false
        output: ${{ env.DC_SARIF_OUTPUT }}

    - name: Upload SARIF result as artifact
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      id: upload_sarif
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ env.DC_SARIF_ARTIFACT_NAME }}
        path: ${{ env.DC_SARIF_OUTPUT }}
        if-no-files-found: error
        retention-days: 1

    - name: Post SARIF to backend
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      shell: bash
      env:
        DC_INPUT_API_KEY: ${{ inputs.api-key }}
        SARIF_ARTIFACT_ID: ${{ steps.upload_sarif.outputs.artifact-id }}
        LANGS_OUTPUT: ${{ steps.langs.outputs.languages }}
      run: |
        set -euo pipefail

        ARTIFACT_ID="${SARIF_ARTIFACT_ID}"
        ARTIFACT_NAME="${DC_SARIF_ARTIFACT_NAME}"

        if [ -z "$ARTIFACT_ID" ]; then
          echo "Missing artifact-id from upload-artifact step; cannot trigger backend SARIF processing." >&2
          exit 1
        fi

        URL="${BACKEND_BASE_URL}/releasemonitor/api/v1/gha/code-analysis/sarif"

        if [ -z "${DC_CAS_ID:-}" ]; then
          echo "No DC_CAS_ID set; cannot correlate SARIF to a scan." >&2
          exit 1
        fi
        CORRELATION_ID="$DC_CAS_ID"

        REPO_FULL_NAME="${GITHUB_REPOSITORY:-${DC_OWNER}/${DC_REPO}}"
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          REF_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        else
          REF_NAME="${GITHUB_REF_NAME:-}"
        fi
        TRIGGERED_BY="${GITHUB_TRIGGERING_ACTOR:-${GITHUB_ACTOR:-}}"

        # For best per-language behavior, run one job per language (matrix)
        # and post each language's SARIF separately.
        LANGS_RAW="${LANGS_OUTPUT}"
        LANGS_CSV="$(echo "$LANGS_RAW" | tr -d ' ' || true)"
        if [ -z "$LANGS_CSV" ]; then
          LANGS_CSV="auto"
        fi

        payload="$(jq -cn \
          --arg correlationId "$CORRELATION_ID" \
          --arg artifactId "$ARTIFACT_ID" \
          --arg artifactName "$ARTIFACT_NAME" \
          --arg owner "${DC_OWNER}" \
          --arg repo "${DC_REPO}" \
          --arg repository "$REPO_FULL_NAME" \
          --arg ref "${GITHUB_REF:-${DC_REF}}" \
          --arg refName "$REF_NAME" \
          --arg sha "${GITHUB_SHA:-}" \
          --arg actor "${GITHUB_ACTOR:-}" \
          --arg triggeringActor "${GITHUB_TRIGGERING_ACTOR:-}" \
          --arg triggeredBy "$TRIGGERED_BY" \
          --arg workflow "${GITHUB_WORKFLOW:-}" \
          --arg workflowRef "${GITHUB_WORKFLOW_REF:-}" \
          --arg job "${GITHUB_JOB:-}" \
          --arg runId "${GITHUB_RUN_ID:-}" \
          --arg runAttempt "${GITHUB_RUN_ATTEMPT:-}" \
          --arg eventName "${GITHUB_EVENT_NAME:-}" \
          --arg languages "$LANGS_CSV" \
          '{
            correlationId: $correlationId,
            artifactId: $artifactId,
            artifactName: $artifactName,
            github: {
              repository: $repository,
              owner: $owner,
              repo: $repo,
              ref: $ref,
              refName: $refName,
              sha: $sha,
              actor: $actor,
              triggeringActor: $triggeringActor,
              triggeredBy: $triggeredBy,
              eventName: $eventName,
              workflow: $workflow,
              workflowRef: $workflowRef,
              job: $job,
              runId: $runId,
              runAttempt: $runAttempt
            },
            codeql: {
              languages: ($languages | split(",") | map(select(length > 0)))
            },
            sarifFileName: "artifact.zip"
          }')"

        HEADER_FILE="$(mktemp)"
        trap 'rm -f "$HEADER_FILE"' EXIT
        printf 'X-API-KEY: %s\nX-DCONE-REGION: %s\n' "${DC_INPUT_API_KEY}" "${DC_INPUT_REGION}" > "$HEADER_FILE"

        echo "Triggering backend SARIF processing at: $URL (artifactId=$ARTIFACT_ID, artifactName=$ARTIFACT_NAME)"

        raw="$(curl -sS -X POST "$URL" \
          --connect-timeout "${DC_CURL_CONNECT_TIMEOUT}" \
          --max-time "${DC_CURL_MAX_TIME}" \
          --retry "${DC_CURL_RETRY_COUNT}" \
          --retry-delay "${DC_CURL_RETRY_DELAY}" \
          --retry-all-errors \
          -H "Content-Type: application/json" \
          -H @"$HEADER_FILE" \
          --data-raw "$payload" \
          -w $'\n%{http_code}')"

        body="${raw%$'\n'*}"
        status="${raw##*$'\n'}"

        if [ -z "$status" ] || ! [[ "$status" =~ ^[0-9][0-9][0-9]$ ]]; then
          echo "Failed to trigger SARIF processing (no valid HTTP status)." >&2
          exit 1
        fi

        if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
          ERR_MSG="$(echo "$body" | jq -r '.error.message? // .error? // .message? // empty' 2>/dev/null || true)"
          if [ -z "$ERR_MSG" ]; then
            ERR_MSG="Backend returned HTTP $status"
          fi
          echo "Failed to trigger SARIF processing (HTTP $status). Error: $ERR_MSG" >&2
          exit 1
        fi

        echo "Backend SARIF processing triggered successfully (HTTP $status)"

    - name: Finalize CAS on backend
      if: ${{ always() && env.DC_SHOULD_RUN == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        DC_INPUT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail

        if [ -z "${DC_CAS_ID:-}" ]; then
          echo "No DC_CAS_ID set; skipping finalize."
          exit 0
        fi

        JOB_STATUS="${{ job.status }}"
        if [ "$JOB_STATUS" = "success" ]; then
          FINAL_STATUS="COMPLETED"
        else
          FINAL_STATUS="FAILED"
        fi

        URL="${BACKEND_BASE_URL}/releasemonitor/api/v1/gha/code-analysis/scans/${DC_CAS_ID}/finalize"
        echo "Finalizing CAS ${DC_CAS_ID} at: $URL (status=${FINAL_STATUS}, job.status=${JOB_STATUS})"

        payload="$(jq -cn \
          --arg status "$FINAL_STATUS" \
          --arg message "Composite action finalized with job.status=${JOB_STATUS}" \
          --arg failureStage "composite" \
          '{ status: $status, message: $message, failureStage: $failureStage }')"

        HEADER_FILE="$(mktemp)"
        trap 'rm -f "$HEADER_FILE"' EXIT
        printf 'X-API-KEY: %s\nX-DCONE-REGION: %s\n' "${DC_INPUT_API_KEY}" "${DC_INPUT_REGION}" > "$HEADER_FILE"

        raw="$(curl -sS -X POST "$URL" \
          --connect-timeout "${DC_CURL_CONNECT_TIMEOUT}" \
          --max-time "${DC_CURL_MAX_TIME}" \
          --retry "${DC_CURL_RETRY_COUNT}" \
          --retry-delay "${DC_CURL_RETRY_DELAY}" \
          --retry-all-errors \
          -H "Content-Type: application/json" \
          -H @"$HEADER_FILE" \
          --data-raw "$payload" \
          -w $'\n%{http_code}')"

        body="${raw%$'\n'*}"
        status="${raw##*$'\n'}"

        if [ -z "$status" ] || ! [[ "$status" =~ ^[0-9][0-9][0-9]$ ]]; then
          echo "Finalize CAS failed (no valid HTTP status)." >&2
          exit 0
        fi

        if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
          ERR_MSG="$(echo "$body" | jq -r '.error.message? // .error? // .message? // empty' 2>/dev/null || true)"
          if [ -z "$ERR_MSG" ]; then
            ERR_MSG="Backend returned HTTP $status"
          fi
          echo "Finalize CAS failed (HTTP $status). Error: $ERR_MSG" >&2
          exit 0
        fi

        echo "Finalize CAS succeeded (HTTP $status)"

    - name: Generate SBOM (Trivy CycloneDX)
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        scan-type: "fs"
        format: "cyclonedx"
        output: ${{ env.DC_SBOM_OUTPUT }}

    - name: Upload SBOM as artifact
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      id: upload_sbom
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ env.DC_SBOM_ARTIFACT_NAME }}
        path: ${{ env.DC_SBOM_OUTPUT }}
        if-no-files-found: error
        retention-days: 1

    - name: Post SBOM to backend
      if: ${{ env.DC_SHOULD_RUN == 'true' }}
      shell: bash
      env:
        DC_INPUT_API_KEY: ${{ inputs.api-key }}
        SBOM_ARTIFACT_ID: ${{ steps.upload_sbom.outputs.artifact-id }}
      run: |
        set -euo pipefail

        if [ -z "${DC_CAS_ID:-}" ]; then
          echo "No DC_CAS_ID set; cannot correlate SBOM to a scan. Enable the prepare flow or ensure CAS creation runs." >&2
          exit 1
        fi

        ARTIFACT_ID="${SBOM_ARTIFACT_ID}"
        ARTIFACT_NAME="${DC_SBOM_ARTIFACT_NAME}"

        if [ -z "$ARTIFACT_ID" ]; then
          echo "Missing artifact-id from upload-artifact step; cannot trigger backend SBOM processing." >&2
          exit 1
        fi

        URL="${BACKEND_BASE_URL}/releasemonitor/api/v1/gha/code-analysis/sbom"

        CORRELATION_ID="$DC_CAS_ID"

        REPO_FULL_NAME="${GITHUB_REPOSITORY:-${DC_OWNER}/${DC_REPO}}"
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME:-}" = "pull_request_target" ]; then
          REF_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        else
          REF_NAME="${GITHUB_REF_NAME:-}"
        fi
        TRIGGERED_BY="${GITHUB_TRIGGERING_ACTOR:-${GITHUB_ACTOR:-}}"

        payload="$(jq -cn \
          --arg correlationId "$CORRELATION_ID" \
          --arg artifactId "$ARTIFACT_ID" \
          --arg artifactName "$ARTIFACT_NAME" \
          --arg sbomFileName "${DC_SBOM_ARTIFACT_NAME}" \
          --arg owner "${DC_OWNER}" \
          --arg repo "${DC_REPO}" \
          --arg repository "$REPO_FULL_NAME" \
          --arg ref "${GITHUB_REF:-${DC_REF}}" \
          --arg refName "$REF_NAME" \
          --arg sha "${GITHUB_SHA:-}" \
          --arg actor "${GITHUB_ACTOR:-}" \
          --arg triggeringActor "${GITHUB_TRIGGERING_ACTOR:-}" \
          --arg triggeredBy "$TRIGGERED_BY" \
          --arg workflow "${GITHUB_WORKFLOW:-}" \
          --arg workflowRef "${GITHUB_WORKFLOW_REF:-}" \
          --arg job "${GITHUB_JOB:-}" \
          --arg runId "${GITHUB_RUN_ID:-}" \
          --arg runAttempt "${GITHUB_RUN_ATTEMPT:-}" \
          --arg eventName "${GITHUB_EVENT_NAME:-}" \
          '{
            correlationId: $correlationId,
            artifactId: $artifactId,
            artifactName: $artifactName,
            sbomFileName: $sbomFileName,
            github: {
              repository: $repository,
              owner: $owner,
              repo: $repo,
              ref: $ref,
              refName: $refName,
              sha: $sha,
              actor: $actor,
              triggeringActor: $triggeringActor,
              triggeredBy: $triggeredBy,
              eventName: $eventName,
              workflow: $workflow,
              workflowRef: $workflowRef,
              job: $job,
              runId: $runId,
              runAttempt: $runAttempt
            }
          }')"

        HEADER_FILE="$(mktemp)"
        trap 'rm -f "$HEADER_FILE"' EXIT
        printf 'X-API-KEY: %s\nX-DCONE-REGION: %s\n' "${DC_INPUT_API_KEY}" "${DC_INPUT_REGION}" > "$HEADER_FILE"

        echo "Triggering backend SBOM processing at: $URL (artifactId=$ARTIFACT_ID, artifactName=$ARTIFACT_NAME, correlationId=$CORRELATION_ID)"

        raw="$(curl -sS -X POST "$URL" \
          --connect-timeout "${DC_CURL_CONNECT_TIMEOUT}" \
          --max-time "${DC_CURL_MAX_TIME}" \
          --retry "${DC_CURL_RETRY_COUNT}" \
          --retry-delay "${DC_CURL_RETRY_DELAY}" \
          --retry-all-errors \
          -H "Content-Type: application/json" \
          -H @"$HEADER_FILE" \
          --data-raw "$payload" \
          -w $'\n%{http_code}')"

        body="${raw%$'\n'*}"
        status="${raw##*$'\n'}"

        if [ -z "$status" ] || ! [[ "$status" =~ ^[0-9][0-9][0-9]$ ]]; then
          echo "Failed to trigger SBOM processing (no valid HTTP status)." >&2
          exit 1
        fi

        if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
          ERR_MSG="$(echo "$body" | jq -r '.error.message? // .error? // .message? // empty' 2>/dev/null || true)"
          if [ -z "$ERR_MSG" ]; then
            ERR_MSG="Backend returned HTTP $status"
          fi
          echo "Failed to trigger SBOM processing (HTTP $status). Error: $ERR_MSG" >&2
          exit 1
        fi

        echo "Backend SBOM processing triggered successfully (HTTP $status)"
