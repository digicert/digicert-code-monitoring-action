# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
#
# Code Monitoring Action v2.
name: "DigiCert Code Monitoring Action v2 (smctl)"
description: "Runs CodeQL + Gitleaks scans and generates an SBOM, then creates a release and uploads the results to DigiCert release monitoring via smctl."
author: "DigiCert"

inputs:
  host:
    description: "DigiCert host URL (e.g. 'https://one.digicert.com'). Must use HTTPS; any trailing slash is stripped. Exported as SM_HOST for smctl."
    required: true

  api-key:
    description: "API key for DigiCert (pass via secrets). Mapped to SM_API_KEY."
    required: true

  name:
    description: "Scan/release name used to create the external release. Required when with-release is true."
    required: false

  with-release:
    description: "When true, require name and tag and build the release name as '<name>-<tag>'; creates a RELEASED external release."
    required: false
    default: "false"

  tag:
    description: "Release tag used only when with-release is true (required when with-release is true)."
    required: false

  dc-release-id:
    description: "Optional pre-existing DCOne release ID. When provided, the action verifies it and reuses it instead of creating a new release."
    required: false
    default: ""

  commit-sha:
    description: "Optional commit SHA override used for checkout and all smctl --commit-sha arguments."
    required: false
    default: ""

  branch:
    description: "Optional branch name override used for checkout and smctl branch metadata arguments."
    required: false
    default: ""

  languages:
    description: "Comma-separated CodeQL languages override (e.g. 'java,javascript'). Leave empty to auto-resolve from GitHub's detected languages via the gh CLI."
    required: false
    default: ""

  codeql-build-mode:
    description: "Preferred CodeQL build-mode when a repo has BOTH build-free and build-required languages: 'none' (default; scans javascript, python, ruby, java, csharp) or 'autobuild' (scans go, swift). Single-group repos auto-select the correct mode regardless of this value."
    required: false
    default: "none"

  github-token:
    description: "Token for gh api calls (release metadata + language detection). Needs contents: read. When all release-* inputs are provided, this token is not used for release metadata."
    required: false
    default: ${{ github.token }}

  release-url:
    description: "GitHub release URL (e.g. https://github.com/org/repo/releases/tag/v1.0.0). When provided together with release-node-id and released-at, the gh api call for release metadata is skipped entirely — useful when github-token lacks contents: read."
    required: false
    default: ""

  release-node-id:
    description: "GitHub release node ID (e.g. RE_kwDO...). Used as --external-global-id. Required together with release-url and released-at to skip the gh api metadata fetch."
    required: false
    default: ""

  released-at:
    description: "ISO 8601 publish timestamp of the release (e.g. 2024-01-15T10:30:00Z). Used as --released-at. Required together with release-url and release-node-id to skip the gh api metadata fetch."
    required: false
    default: ""

  source:
    description: "Release source label for the external release (GITHUB or GITHUB_ACTION). Sets smctl --source."
    required: false
    default: "GITHUB_ACTION"

  digicert-cdn:
    description: "Base URL for downloading the smctl binary. Must be HTTPS."
    required: false
    default: "https://pki-downloads.digicert.com/stm/latest"

  sbom-spec-version:
    description: "CycloneDX spec version for smctl sbom generate (1.5 or 1.6)."
    required: false
    default: "1.6"

  skip-sbom:
    description: "Skip SBOM generation and upload, including external SBOM files."
    required: false
    default: "false"

  skip-sarif:
    description: "Skip CodeQL and Gitleaks scans and all SARIF uploads, including external files."
    required: false
    default: "false"

  external-paths:
    description: 'JSON array of SCANNER_TYPE:HTTPS_URL entries, for example ["CODEQL:https://example.com/report.zip", "SBOM:https://example.com/sbom.json"]. URLs must provide upload-ready files; redirects must remain on the same origin. Pass signed URLs through secrets.'
    required: false
    default: "[]"

  use-github-caching-service:
    description: "Cache downloaded tools (smctl, gitleaks) across runs. When false, tools download every run."
    required: false
    default: "true"

  use-binary-sha256-checksum:
    description: "Key the smctl cache on the CDN smctl.sha256 so a new smctl build auto-invalidates the cache."
    required: false
    default: "true"

  cache-version:
    description: "Manual cache-busting key used for smctl when use-binary-sha256-checksum is false."
    required: false
    default: "0.0.0-0"

  gitleaks-version:
    description: "Gitleaks release version to download. Defaults to the action's pinned version; bump this to upgrade without waiting for an action release."
    required: false
    default: "8.18.4"

  codeql-tools-version:
    description: "CodeQL CLI bundle version passed to codeql-action tools: (e.g. '2.17.6'). Leave empty to use the version bundled with the pinned codeql-action SHA."
    required: false
    default: ""

  scan-timeout:
    description: "Maximum seconds to wait for background scans (Gitleaks + SBOM generate) to complete. Increase for large repos or low-compute runners."
    required: false
    default: "600"

runs:
  using: "composite"
  steps:
    # 1 -----------------------------------------------------------------------
    - name: Block unsafe pull_request_target trigger
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: node "$ACTION_DIR/dist/index.js" guard-trigger

    # 2 -----------------------------------------------------------------------
    - name: Sanitize and normalize action inputs
      id: normalize_inputs
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        RAW_HOST: ${{ inputs.host }}
        RAW_API_KEY: ${{ inputs.api-key }}
        RAW_NAME: ${{ inputs.name }}
        RAW_WITH_RELEASE: ${{ inputs.with-release }}
        RAW_TAG: ${{ inputs.tag }}
        RAW_RELEASE_ID: ${{ inputs.dc-release-id }}
        RAW_COMMIT_SHA: ${{ inputs.commit-sha }}
        RAW_BRANCH: ${{ inputs.branch }}
        RAW_LANGUAGES: ${{ inputs.languages }}
        RAW_SBOM_SPEC: ${{ inputs.sbom-spec-version }}
        RAW_CDN: ${{ inputs.digicert-cdn }}
        RAW_SKIP_SBOM: ${{ inputs.skip-sbom }}
        RAW_SKIP_SARIF: ${{ inputs.skip-sarif }}
        RAW_EXTERNAL_PATHS: ${{ inputs.external-paths }}
      run: node "$ACTION_DIR/dist/index.js" normalize-inputs
    # 3 -----------------------------------------------------------------------
    - name: Export smctl auth
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        DC_INPUT_API_KEY: ${{ inputs.api-key }}
      run: node "$ACTION_DIR/dist/index.js" export-auth
    # 4 -----------------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      with:
        persist-credentials: false
        ref: ${{ inputs.commit-sha != '' && inputs.commit-sha || inputs.branch != '' && inputs.branch || github.ref }}
        fetch-depth: ${{ (inputs.commit-sha != '' || inputs.branch != '') && 0 || 1 }}

    # 5 -----------------------------------------------------------------------
    - name: Resolve repo context (owner/repo/ref)
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        DC_GITLEAKS_VERSION_INPUT: ${{ inputs.gitleaks-version }}
        DC_CODEQL_TOOLS_VERSION_INPUT: ${{ inputs.codeql-tools-version }}
        DC_INPUT_COMMIT_SHA: ${{ inputs.commit-sha }}
        DC_INPUT_BRANCH: ${{ inputs.branch }}
      run: node "$ACTION_DIR/dist/index.js" resolve-context
    # 6 -----------------------------------------------------------------------
    - name: Compute tool cache keys
      id: cache_keys
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        DC_USE_CHECKSUM: ${{ inputs.use-binary-sha256-checksum }}
        DC_CACHE_VERSION: ${{ inputs.cache-version }}
      run: node "$ACTION_DIR/dist/index.js" cache-keys
    - name: Restore smctl from cache
      id: smctl_cache
      if: ${{ inputs.use-github-caching-service == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.DC_SMCTL_TOOL_CACHE_ROOT }}
        key: ${{ env.SMCTL_CACHE_KEY }}

    - name: Restore gitleaks from cache
      id: gitleaks_cache
      if: ${{ inputs.use-github-caching-service == 'true' && env.DC_RUN_GITLEAKS == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.DC_GITLEAKS_TOOL_CACHE_ROOT }}
        key: ${{ env.GITLEAKS_CACHE_KEY }}

    - name: Download and verify smctl
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: node "$ACTION_DIR/dist/index.js" download-smctl
    - name: Download and verify gitleaks
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: node "$ACTION_DIR/dist/index.js" download-gitleaks
    - name: Add tools to PATH
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: node "$ACTION_DIR/dist/index.js" add-tools
    # 7 — Create release (blocking — scans need the Release ID) ----------------
    - name: Create release
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        DC_INPUT_RELEASE_URL: ${{ inputs.release-url }}
        DC_INPUT_RELEASE_NODE_ID: ${{ inputs.release-node-id }}
        DC_INPUT_RELEASED_AT: ${{ inputs.released-at }}
        DC_INPUT_SOURCE: ${{ inputs.source }}
      run: node "$ACTION_DIR/dist/index.js" create-release
    # 7b — Gitleaks + SBOM generate -------------------------------------------
    - name: Start Gitleaks scan and SBOM generate (background)
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: node "$ACTION_DIR/dist/index.js" start-scans
    # 8 -----------------------------------------------------------------------
    - name: Resolve CodeQL languages
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        DC_INPUT_CODEQL_BUILD_MODE: ${{ inputs.codeql-build-mode }}
      run: node "$ACTION_DIR/dist/index.js" resolve-languages
    - name: Initialize CodeQL
      if: ${{ env.DC_RUN_CODEQL == 'true' && env.DC_LANGUAGES != '' }}
      uses: github/codeql-action/init@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
      with:
        languages: ${{ env.DC_LANGUAGES }}
        build-mode: ${{ env.DC_CODEQL_BUILD_MODE }}
        tools: ${{ env.DC_CODEQL_TOOLS_VERSION }}

    # 9 -----------------------------------------------------------------------
    - name: Perform CodeQL Analysis
      if: ${{ env.DC_RUN_CODEQL == 'true' && env.DC_LANGUAGES != '' }}
      uses: github/codeql-action/analyze@411bbbe57033eedfc1a82d68c01345aa96c737d7 # v4
      with:
        upload: false
        upload-database: false
        output: ${{ env.DC_SARIF_OUTPUT }}

    # 10b — Wait for background jobs (Gitleaks + SBOM) -----------------------
    - name: Wait for Gitleaks and SBOM generate
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        DC_SCAN_TIMEOUT: ${{ inputs.scan-timeout }}
      run: node "$ACTION_DIR/dist/index.js" wait-scans
    # 10c — Package SARIFs ----------------------------------------------------
    - name: Package each SARIF independently
      if: ${{ always() && steps.normalize_inputs.outcome == 'success' }}
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: node "$ACTION_DIR/dist/index.js" package-sarifs
    # 11 — Upload scans + SBOM ------------------------------------------------
    - name: Upload scans and SBOM (sequential)
      if: ${{ always() && steps.normalize_inputs.outcome == 'success' }}
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: node "$ACTION_DIR/dist/index.js" upload